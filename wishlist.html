<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist – BookHaven</title>
  <meta name="description" content="Your BookHaven wishlist — saved books you love.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="toast-container"></div>

<header class="navbar" role="banner">
  <div class="navbar__inner">
    <a href="index.html" class="navbar__logo" aria-label="BookHaven Home">
      <div class="navbar__logo-icon"><i class="fa-solid fa-book-open"></i></div>
      <div class="navbar__logo-text">Book<span>Haven</span></div>
    </a>
    <div class="nav__overlay"></div>
    <nav class="nav__menu" id="nav-menu" aria-label="Main navigation">
      <a href="index.html"   class="nav__link">Home</a>
      <a href="books.html"   class="nav__link">Books</a>
      <a href="about.html"   class="nav__link">About</a>
      <a href="contact.html" class="nav__link">Contact</a>
    </nav>
    <div class="navbar__actions">
      <a href="wishlist.html" class="navbar__icon-btn" aria-label="Wishlist">
        <i class="fa-regular fa-heart"></i>
        <span class="badge--wishlist"></span>
      </a>
      <a href="cart.html" class="navbar__icon-btn" aria-label="Cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="badge--cart"></span>
      </a>
      <button class="btn--login"><i class="fa-regular fa-user"></i> <span>Sign In</span></button>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="page-header page-top reveal">
    <div class="container">
      <h1>My Wishlist</h1>
      <p>Books you've saved for later</p>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <i class="fa-solid fa-chevron-right"></i>
        <span>Wishlist</span>
      </nav>
    </div>
  </div>

  <section class="section">
    <div class="container" style="max-width:860px;">

      <!-- Empty State -->
      <div id="wishlist-empty" class="cart-empty hidden">
        <i class="fa-regular fa-heart"></i>
        <h3>Your wishlist is empty</h3>
        <p>Start adding books you love by clicking the heart icon on any book card.</p>
        <a href="books.html" class="btn btn--primary">
          <i class="fa-solid fa-book-open"></i> Browse Books
        </a>
      </div>

      <!-- Wishlist Items -->
      <ul class="wl-list" id="wishlist-items" aria-label="Wishlist items"></ul>

    </div>
  </section>
</main>

<footer class="footer" role="contentinfo">
  <div class="container">
    <div class="footer__bottom" style="border-top:1px solid rgba(255,255,255,.08);padding:var(--sp-lg) 0;">
      <span>&copy; 2026 BookHaven. All rights reserved.</span>
      <div><a href="index.html">Home</a> &nbsp;·&nbsp; <a href="books.html">Books</a></div>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/animate.js"></script>
</body>
</html>
